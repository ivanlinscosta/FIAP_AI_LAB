<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIAP AI Lab - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body data-page="login">
  <main class="login-container">
    <section class="card login-card p-4 shadow-lg">
      <div class="text-center mb-4">
        <p class="eyebrow">FIAP AI Lab</p>
        <h1 class="h3 mb-1">Professor Console</h1>
        <p class="text-muted small">Tools, Automations and Workflows</p>
      </div>

      <form id="login-form">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button class="btn btn-fiap-primary w-100" type="submit">Login</button>
      </form>

      <p id="login-error" class="text-danger mt-3 text-center d-none"></p>
    </section>
  </main>
</body>
</html>
