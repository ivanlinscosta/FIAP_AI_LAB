<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIAP AI Lab - Primeiro acesso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="login-container">
    <section class="card login-card p-4 shadow-lg">
      <div class="text-center mb-4">
        <p class="eyebrow">FIAP AI Lab</p>
        <h1 class="h3 mb-1">Primeiro acesso</h1>
        <p class="text-muted small">Crie o perfil do professor para acessar o dashboard</p>
      </div>

      <form id="setup-form">
        <div class="mb-3">
          <label for="username" class="form-label">Nome de usuário</label>
          <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Nova senha</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <div class="mb-4">
          <label for="confirm-password" class="form-label">Confirmar senha</label>
          <input id="confirm-password" name="confirm-password" type="password" class="form-control" autocomplete="new-password" required>
        </div>
        <button class="btn btn-fiap-primary w-100" type="submit">Criar perfil e entrar</button>
      </form>

      <p id="setup-error" class="text-danger mt-3 text-center d-none"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("setup-form");
    const errorNode = document.getElementById("setup-error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorNode.textContent = "";
      errorNode.classList.add("d-none");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      try {
        const response = await fetch("/api/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            password,
            confirm_password: confirmPassword,
          }),
        });

        if (!response.ok) {
          let message = "Não foi possível criar o perfil.";
          try {
            const payload = await response.json();
            message = payload.detail || message;
          } catch {
          }
          throw new Error(message);
        }

        window.location.href = "/";
      } catch (error) {
        errorNode.textContent = error.message || "Não foi possível criar o perfil.";
        errorNode.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
